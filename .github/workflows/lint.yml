name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6.0.9
    - name: Set up Node
      uses: actions/setup-node@v6.4.0
      with:
        node-version: '24'
    - name: Install node dependencies
      run: pnpm install
    - name: Run JavaScript linter
      run: pnpm lint
